broker: oanda
environment: practice   # practice = Demo-Account (empfohlen), live = echtes Konto
instrument: EUR_USD     # OANDA-Notation: Unterstrich statt Slash
granularity: H1         # OANDA-Codes: M1,M5,M15,M30,H1,H4,D,W ...

strategy:
  fast_ma: 20
  slow_ma: 50
  rsi_period: 14
  rsi_buy_max: 65   # RSI muss unter diesem Wert liegen, damit ein Long-Signal bestaetigt wird
  rsi_sell_min: 35  # RSI muss ueber diesem Wert liegen, damit ein Exit-Signal bestaetigt wird

risk:
  initial_capital: 10000
  risk_per_trade: 0.01     # 1% des Kapitals pro Trade riskieren
  stop_loss_pct: 0.02      # 2% Stop-Loss unter Entry
  take_profit_pct: 0.04    # 4% Take-Profit ueber Entry
  fee_pct: 0.0002          # Naeherung fuer Spread-/Transaktionskosten (0.02%, typischer EUR/USD-Spread)

paper_trading:
  poll_interval_seconds: 60
